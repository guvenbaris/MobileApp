# F0-09: Analiz, test ve Android derlemesi.
# Her commit'te değil; haftalık, elle ve PR açıldığında çalışır.
name: CI

on:
  schedule:
    - cron: '0 3 * * 1' # Her pazartesi 03:00 UTC (TR 06:00)
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.8

defaults:
  run:
    working-directory: quran_app

jobs:
  analyze-test:
    name: Analiz ve test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: İçerik veritabanı
        run: dart run tool/content/build_content_db.dart

      - name: Biçim kontrolü
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Statik analiz
        run: flutter analyze --fatal-infos

      - name: Testler
        run: flutter test --coverage

      - name: Kapsam özeti
        if: always()
        run: |
          sudo apt-get install -y -qq lcov > /dev/null
          if [ -f coverage/lcov.info ]; then
            {
              echo '### Test kapsamı'
              echo '```'
              lcov --summary coverage/lcov.info 2>&1 | grep -E 'lines|functions'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: quran_app/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android derleme
    runs-on: ubuntu-latest
    needs: analyze-test
    timeout-minutes: 30
    strategy:
      matrix:
        flavor: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: İçerik veritabanı
        run: dart run tool/content/build_content_db.dart

      - name: APK (${{ matrix.flavor }})
        run: flutter build apk --debug --flavor ${{ matrix.flavor }} -t lib/main_${{ matrix.flavor }}.dart
